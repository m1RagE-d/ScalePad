<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b6bcb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BIP评估">
  <link rel="manifest" href="manifest.json">
  <title>BIP评估</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #f4f7fb; color: #102a43; }
    header { position: relative; height: 92px; padding: 12px 20px; background: #0b6bcb; color: #fff; text-align: center; }
    header h1 { margin: 0 0 2px; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; }
    header div { font-size: clamp(15px, 2vw, 20px); line-height: 1.25; }
    header .home-button { position: absolute; top: 50%; left: 20px; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; margin: 0; padding: 0; transform: translateY(-50%); border-radius: 12px; background: #fff; color: #0b6bcb; }
    main { width: 100%; height: calc(100% - 92px); padding: 0; }
    .card { width: 100%; height: 100%; padding: 24px 4vw 18px; background: #fff; }
    #setup, #done { max-width: 900px; height: auto; margin: 30px auto; border-radius: 16px; box-shadow: 0 4px 18px #1232; }
    #done { max-height: calc(100% - 60px); overflow-y: auto; }
    #editor { overflow-y: auto; padding: 28px 5vw 40px; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .editor-top h2 { margin: 0; font-size: clamp(28px, 4vw, 42px); }
    .editor-top button { width: auto; min-width: 150px; margin: 0; }
    .editor-tools { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
    .editor-tools input { flex: 1; margin: 0; }
    .editor-tools button { width: auto; margin: 0; white-space: nowrap; }
    .preset-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .preset-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border: 2px solid #d9e2ec; border-radius: 12px; background: #fff; color: #102a43; text-align: left; font-size: 20px; }
    .preset-item.active { border-color: #0b6bcb; background: #eaf3ff; }
    .preset-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preset-item small { flex: none; color: #627d98; font-size: 15px; font-weight: 400; }
    .editor-form { max-width: 980px; margin: 0 auto; padding-top: 6px; border-top: 1px solid #d9e2ec; }
    .editor-form > label { display: block; margin-top: 18px; font-size: 20px; font-weight: 600; }
    .question-edit { margin: 16px 0; padding: 18px; border: 1px solid #d9e2ec; border-radius: 12px; background: #f8fafc; }
    .question-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 20px; font-weight: 700; }
    .question-head button { width: auto; margin: 0; padding: 8px 12px; font-size: 16px; background: #ffe4e1; color: #9b2c2c; }
    .question-edit input { margin: 6px 0 10px; font-size: 19px; }
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-row input { flex: 1; }
    .option-row button { width: auto; margin: 6px 0 10px; padding: 10px 14px; font-size: 17px; background: #e3eefb; }
    .editor-actions { display: flex; gap: 12px; margin-top: 18px; }
    .editor-actions button { flex: 1; margin: 0; font-size: 22px; }
    .empty-state { padding: 24px; color: #627d98; text-align: center; }
    #quiz { display: flex; flex-direction: column; justify-content: space-between; }
    .hidden { display: none !important; }
    select, input, button { font: inherit; }
    select, input, textarea { width: 100%; margin: 8px 0 18px; padding: 16px; border: 1px solid #bcccdc; border-radius: 10px; font-size: 22px; font-family: inherit; }
    button { width: 100%; margin: 8px 0; padding: 22px; border: 0; border-radius: 16px; background: #e3eefb; color: #102a43; font-size: clamp(28px, 5vw, 52px); font-weight: 700; -webkit-tap-highlight-color: transparent; }
    button:disabled { opacity: 1; }
    button.choice.selected { background: #0b6bcb; color: #fff; }
    button.small { padding: 14px; font-size: 20px; background: #d9eaf7; }
    button.selected { background: #0b6bcb; color: #fff; }
    .q { flex: 1; display: flex; align-items: center; justify-content: center; margin: 10px 0; text-align: center; white-space: pre-line; font-size: clamp(42px, 7vw, 86px); font-weight: 700; line-height: 1.25; }
    #questionMedia { display: flex; align-items: center; justify-content: center; max-height: 30%; margin: 4px 0 10px; }
    #questionMedia img { max-width: min(360px, 45vw); max-height: 220px; border-radius: 12px; object-fit: contain; background: #101820; }
    #choices { flex: 1.25; display: flex; align-items: stretch; gap: 3vw; width: 100%; }
    #choices button { height: 100%; min-height: 0; margin: 0; border-radius: 18px; font-size: clamp(44px, 7vw, 82px); }
    #choices.many { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    #choices.many button { font-size: clamp(28px, 4vw, 48px); }
    #choices.long-options button { font-size: clamp(18px, 2.4vw, 32px); line-height: 1.25; padding: 10px; }
    #choices.many[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #choices.many[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #choices.free-response { flex-direction: column; justify-content: center; align-items: stretch; gap: 14px; }
    #choices .free-response-input { flex: none; height: 150px; margin: 0; resize: none; font-size: clamp(28px, 4vw, 48px); }
    #choices.free-response button { flex: none; height: auto; min-height: 92px; }
    .muted { margin: 10px 0 0; color: #627d98; text-align: center; font-size: clamp(16px, 2vw, 24px); }
    .storage-status { min-height: 24px; margin: 8px 0 0; color: #627d98; text-align: center; font-size: 16px; }
    .storage-status.error { color: #b42318; font-weight: 700; }
    .storage-status.ok { color: #087443; }
    .save-setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 18px 0; padding: 14px 16px; border: 1px solid #d9e2ec; border-radius: 12px; background: #f8fafc; }
    .save-setting strong { display: block; font-size: 19px; }
    .save-setting span { display: block; margin-top: 4px; color: #627d98; font-size: 15px; }
    .save-setting button { width: auto; flex: none; margin: 0; padding: 12px 16px; font-size: 18px; }
    #editor .editor-top button { width: auto; min-width: 150px; margin: 0; }
    #editor .editor-tools input { margin: 0; }
    #editor .editor-tools button { width: auto; margin: 0; }
    #editor .preset-item { width: auto; margin: 0; padding: 16px 18px; border: 2px solid #d9e2ec; border-radius: 12px; background: #fff; font-size: 20px; }
    #editor .preset-item.active { border-color: #0b6bcb; background: #eaf3ff; }
    #editor .question-head button { width: auto; margin: 0; padding: 8px 12px; border: 0; border-radius: 10px; font-size: 16px; background: #ffe4e1; color: #9b2c2c; }
    #editor .option-row button { width: auto; margin: 6px 0 10px; padding: 10px 14px; font-size: 17px; }
    #editor .editor-actions button { flex: 1; width: auto; margin: 0; font-size: 22px; }
    @media (max-width: 700px) { #choices { gap: 12px; } #quiz { padding-left: 16px; padding-right: 16px; } }
    .quiz-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; height: 72px; }
    button.icon-button { display: flex; align-items: center; justify-content: center; flex: none; width: 64px; height: 56px; margin: 0; padding: 0; border-radius: 12px; background: #e3eefb; color: #102a43; font-size: 44px; line-height: 1; }
    button.icon-button svg { display: block; width: 34px; height: 34px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    header .home-button svg { width: 32px; height: 32px; stroke-width: 2.2; }
    button.icon-button:disabled { opacity: .4; }
    .question-wrap { display: flex; align-items: center; justify-content: center; gap: 18px; flex: 1; min-height: 0; }
    .question-wrap .q { min-width: 0; }
    .question-wrap.empty-question { flex: none; height: 88px; }
    .question-wrap.empty-question .q { display: none; }
    button.audio-button { width: 76px; height: 76px; border-radius: 50%; font-size: 36px; }
    button.audio-button.speaking { background: #0b6bcb; color: #fff; }
    #questionMedia { flex: 0 1 48%; min-height: 0; max-height: 48%; }
    #questionMedia:empty { display: none; }
    #questionMedia img { width: auto; height: auto; max-width: min(88vw, 1000px); max-height: min(48vh, 680px); }
    .section-band { flex: none; padding: 10px 14px; margin-bottom: 6px; border-radius: 12px; background: #eaf3ff; border: 1px solid #c9ddf7; }
    .section-band strong { display: block; color: #0b6bcb; font-size: clamp(18px, 2.2vw, 26px); }
    .section-band span { display: block; margin-top: 3px; color: #334e68; font-size: clamp(15px, 1.8vw, 21px); line-height: 1.35; }
    .researcher-script { flex: none; margin: 8px 0 0; color: #829ab1; text-align: center; font-size: 15px; }
    .q.medium { font-size: clamp(30px, 4.6vw, 58px); }
    .q.small { font-size: clamp(22px, 3.2vw, 40px); line-height: 1.35; }
    .section-table { width: 100%; margin: 12px 0 20px; border-collapse: collapse; font-size: 17px; }
    .section-table th, .section-table td { padding: 9px 10px; border-bottom: 1px solid #e3eaf2; text-align: left; }
    .section-table th { color: #627d98; font-size: 15px; font-weight: 600; }
    .section-table td.result { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .section-table td.rate, .section-table td.skip { color: #627d98; white-space: nowrap; }
    .section-table tr.total td { border-top: 2px solid #bcccdc; border-bottom: 0; background: #f4f7fb; font-weight: 700; }
    .dashboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
    .metric { padding: 16px; border: 1px solid #d9e2ec; border-radius: 12px; background: #f8fafc; }
    .metric strong { display: block; color: #627d98; font-size: 16px; font-weight: 600; }
    .metric span { display: block; margin-top: 4px; color: #102a43; font-size: clamp(24px, 3vw, 34px); font-weight: 700; }
    .log-path { margin: 16px 0; padding: 14px 16px; border-radius: 10px; background: #edf7f1; color: #087443; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
    .dashboard-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .dashboard-actions button { margin: 0; }
    @media (max-width: 700px) { .dashboard { grid-template-columns: 1fr 1fr; } .dashboard-actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><h1>BIP评估</h1><button class="home-button hidden" id="homeButton" type="button" aria-label="回到主界面" title="回到主界面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9.5V21h14V9.5"></path><path d="M9 21v-6h6v6"></path></svg></button></header>
  <main>
    <section id="setup" class="card">
      <h2>开始答题</h2>
      <label for="patient">患者编号</label>
      <input id="patient" placeholder="例如 P001" autocomplete="off">
      <label for="patientAge">年龄</label>
      <input id="patientAge" type="number" min="0" max="120" step="1" placeholder="例如 72" inputmode="numeric" autocomplete="off">
      <label for="ageBand">名人题版本</label>
      <select id="ageBand">
        <option value="">自动（按年龄：30 岁以下用 18–30 岁版）</option>
        <option value="young">手动：18–30 岁版</option>
        <option value="older">手动：31–60 岁版</option>
      </select>
      <label for="epilepsy">癫痫病史确认（必填）</label>
      <select id="epilepsy">
        <option value="">请选择</option>
        <option value="no">无癫痫病史</option>
        <option value="yes">有癫痫病史</option>
      </select>
      <label for="preset">选择预设</label>
      <select id="preset"></select>
      <div class="save-setting"><div><strong>语音朗读</strong><span>关闭后不会自动朗读题目；答题界面的按钮仍可随时手动播放或停止</span></div><button class="small" id="voiceToggle">开启</button></div>
      <button class="small" id="start">开始</button>
      <button class="small" id="openEditor">问卷编辑</button>
      <div class="save-setting"><div><strong>答题记录保存位置</strong><span id="saveStatus">启动测试前会检查本机持久化存储；可另选自定义文件夹</span></div><button class="small" id="chooseSaveFolder">选择文件夹</button></div>
      <p class="storage-status" id="storageStatus" aria-live="polite"></p>
      <p class="muted">每答完一题立即写入本机记录。完成后可导出到“下载”或自定义位置。</p>
    </section>
    <section id="quiz" class="card hidden">
      <div class="quiz-nav">
        <button class="icon-button" id="prevQuestion" type="button" aria-label="上一题" title="上一题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
        <button class="icon-button" id="nextQuestion" type="button" aria-label="下一题" title="下一题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <div class="section-band"><strong id="sectionName"></strong><span id="sectionIntro"></span></div>
      <div class="question-wrap" id="questionWrap"><div class="q" id="question"></div><button class="icon-button audio-button" id="speakQuestion" type="button" aria-label="朗读题目" title="朗读题目">🔊</button></div>
      <div id="questionMedia"></div>
      <div id="choices"></div>
      <p class="researcher-script hidden" id="researcherScript"></p>
    </section>
    <section id="done" class="card hidden">
      <h2>答题完成</h2>
      <p id="summary"></p>
      <div id="sectionResults"></div>
      <div id="dashboard" class="dashboard"></div>
      <div id="logPath" class="log-path"></div>
      <div class="dashboard-actions"><button class="small" id="csv">导出 CSV（下载）</button><button class="small" id="json">导出 JSON（下载）</button><button class="small" id="again">开始下一位患者</button></div>
    </section>
    <section id="editor" class="card hidden">
      <div class="editor-top"><h2>问卷编辑</h2><button class="small" id="backToSetup">返回答题</button></div>
      <div class="editor-tools"><input id="presetFilter" placeholder="筛选问卷名称" autocomplete="off"><button class="small" id="newPreset">新建问卷</button></div>
      <div id="presetList" class="preset-list"></div>
      <div id="editorForm" class="editor-form hidden">
        <label for="editorName">问卷名称</label>
        <input id="editorName" placeholder="例如：中文老年患者版本">
        <div id="questionEditor"></div>
        <div class="editor-actions"><button class="small" id="addQuestion">添加题目</button><button class="small" id="savePreset">保存问卷</button></div>
      </div>
    </section>
  </main>
  <script src="presets.js"></script>
  <script src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
